const base = () => `data/users/${S.uid}`;

async function writeTx(tx, prevYm) {
  const ym = ymOf(tx.at);

  // optimistic local update
  if (prevYm && S.txByMonth[prevYm]) S.txByMonth[prevYm] = S.txByMonth[prevYm].filter((t) => t.id !== tx.id);
  (S.txByMonth[ym] ||= []);
  S.txByMonth[ym] = [tx, ...S.txByMonth[ym].filter((t) => t.id !== tx.id)];
  render();
  if (!S.db) return;
  try {
    if (prevYm && prevYm !== ym) await monthCol(prevYm).doc(tx.id).delete();
    await monthCol(ym).doc(tx.id).set(tx);
  } catch (e) { toast(e?.code === 'quota_exceeded' ? 'Storage is full.' : 'Saved on this screen, but syncing failed. Check your connection.'); }
}

}

async function boot() {
  render();

/* ───────────── Apple Wallet link capture ─────────────
   The Shortcut opens  APP_URL#w-<cents>-<Merchant-Words>--<Card-Words>  */
function parseHash(h) {
  const m = /^#?w-(\d{1,9})-(.+?)-{2,}(.*)$/.exec(h || '') || /^#?w-(\d{1,9})-(.+)$/.exec(h || '');
  if (!m) return null;
  const words = (s) => (s || '').split('-').filter(Boolean).join(' ').trim();
  return { cents: Number(m[1]), merchant: words(m[2]) || 'Apple Pay', card: words(m[3]) };
}
function handleHash() {
  const h = location.hash;
  const p = parseHash(h);
  if (!p || !S.ready) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  const now = Date.now();
  S.cfg.seen = (S.cfg.seen || []).filter((x) => now - x.t < 10 * 60e3);
  if (S.cfg.seen.some((x) => x.h === h)) { toast('Already logged this purchase.'); return; }
  const cardId = matchCard(p.card);
  const key = mKey(p.merchant);
  const recent = (S.txByMonth[ymOf(now)] || []).find((t) => t.cents === p.cents && t.key === key && (t.card || null) === cardId && (cardId || (t.raw || '').toLowerCase() === p.card.toLowerCase()) && Math.abs(new Date(t.at) - now) < 60e3);
  if (recent) { toast('Duplicate ignored: same amount, merchant and card within 60 seconds.'); return; }
  S.cfg.seen.push({ h, t: now });
  const tx = { id: uid(), cents: p.cents, merchant: titleCase(p.merchant), key, card: cardId, raw: p.card || null, cat: categorize(p.merchant), at: new Date().toISOString(), note: '', src: 'wallet' };
  S.cfg.lastWallet = tx.at;
  saveConfig();
  S.tab = 'cards';
  writeTx(tx);
  checkAlerts(tx);
  openSheet({ type: 'logged', tx });
}
const titleCase = (s) => /[a-z]/.test(s) ? s : s.toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase());

/* ───────────── budgets & alerts ───────────── */
function monthTx(ym = S.month) { return S.txByMonth[ym] || []; }
function checkAlerts(tx) {
  const ym = ymOf(tx.at), list = monthTx(ym), msgs = [];
  const test = (kind, id, label, limit, spent) => {
    if (!limit) return;
    const pct = (spent / limit) * 100, hit = pct >= 100 ? 100 : pct >= 80 ? 80 : 0;
    const k = `${ym}:${kind}:${id}`;
    if (hit && (S.cfg.alerts[k] || 0) < hit) {
      S.cfg.alerts[k] = hit;
      msgs.push(hit === 100 ? `${label} exceeded by ${money(spent - limit)}` : `${Math.floor(pct)}% of ${label} used`);
    }
  };
  if (tx.cat) { const c = catById(tx.cat); test('cat', tx.cat, `${c?.name} budget`, S.cfg.budgets[tx.cat] || 0, list.filter((t) => t.cat === tx.cat).reduce((s, t) => s + t.cents, 0)); }
  if (tx.card) { const c = cardById(tx.card); test('card', tx.card, `${c?.name} limit`, c?.limit || 0, list.filter((t) => t.card === tx.card).reduce((s, t) => s + t.cents, 0)); }
  if (msgs.length) { saveConfig(); setTimeout(() => toast('⚠︎ ' + msgs.join(' · ')), 900); }
}

function render() {
  renderTabs();

  const v = { cards: viewCards, activity: viewActivity, budget: viewBudget, settings: viewSettings }[S.tab]();
  // keep search focus while typing
  const qFocused = document.activeElement?.id === 'q', pos = qFocused ? document.activeElement.selectionStart : 0;

  app.innerHTML = v;
  if (qFocused) { const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch {} }
  const car = $('#carousel');
  if (car) { if (cs != null) car.scrollLeft = cs; car.onscroll = onCarousel; }

}
function onCarousel(e) {
  const el = e.currentTarget, w = (el.children[0]?.offsetWidth || 1) + 12;
  const i = Math.max(0, Math.min(activeCards().length, Math.round(el.scrollLeft / w)));
  if (i !== S.activeCard) { S.activeCard = i; S.picked = null; clearTimeout(onCarousel.t); onCarousel.t = setTimeout(render, 120); }
}

const SHEET_INIT = {

    amt.addEventListener('input', () => { amt.value = amt.value.replace(/[^0-9.,]/g, ''); ok(); });
    merch.addEventListener('input', ok);
    root.querySelectorAll('[data-recent]').forEach((b) => b.addEventListener('click', () => {
      merch.value = b.dataset.recent; if (b.dataset.cat) { s.cat = b.dataset.cat; root.querySelectorAll('[data-pick="cat"]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === s.cat))); } ok();
    }));
    wirePickers(root, s);
    $('#addf').addEventListener('submit', (e) => { e.preventDefault(); submitAdd(); });
    setTimeout(() => amt.focus(), 30);
  },
  edit(s) {
    const root = $('#sheet-root');
    s.onPick = (k) => { if (k === 'cat') $('#simrow').hidden = !(s.cat && s.cat !== s.tx.cat); };
    wirePickers(root, s);
  },
  card(s) {
    const root = $('#sheet-root'), d = s.d;
    $('#cname').addEventListener('input', (e) => { d.name = e.target.value; $('#cpn').textContent = d.name || 'Card name'; });
    $('#clast').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); d.last4 = e.target.value; $('#cpl').textContent = '•••• ' + (d.last4 || '••••'); });
    root.querySelectorAll('[data-ctype]').forEach((b) => b.addEventListener('click', () => { d.type = b.dataset.ctype; root.querySelectorAll('[data-ctype]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); $('#cpt').textContent = d.type; }));
    root.querySelectorAll('[data-color]').forEach((b) => b.addEventListener('click', () => { d.color = b.dataset.color; root.querySelectorAll('[data-color]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); $('#cprev').style.background = d.color; }));
  },
  filters() {
    const root = $('#sheet-root');
    root.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => {
      S.search[b.dataset.f] = b.dataset.v; root.querySelectorAll(`[data-f="${b.dataset.f}"]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); render();
    }));
    $('#ffrom').addEventListener('change', (e) => { S.search.from = e.target.value; render(); });
    $('#fto').addEventListener('change', (e) => { S.search.to = e.target.value; render(); });
  },
  import(s) { $('#csvfile').addEventListener('change', (e) => readCsv(e.target.files?.[0], s)); if (s.rows) renderCsvMap(s); },
};

/* ───────────── actions ───────────── */
function submitAdd() {
  const s = S.sheet, cents = parseCents($('#amt').value), merchant = $('#merch').value.trim();
  if (!(cents > 0) || !merchant) return;
  const at = $('#when').value ? new Date($('#when').value).toISOString() : new Date().toISOString();
  const tx = { id: uid(), cents, merchant, key: mKey(merchant), card: s.card || null, raw: null, cat: s.cat || categorize(merchant), at, note: $('#note').value.trim(), src: 'manual' };
  if (s.card) S.cfg.lastCard = s.card;
  saveConfig();
  closeSheet(); writeTx(tx); toast('Expense added'); checkAlerts(tx);
}
function saveEdit() {
  const s = S.sheet, t = s.tx, cents = parseCents($('#eamt').value), merchant = $('#emerch').value.trim();
  if (!cents || !merchant) return toast('Enter an amount and a merchant.');
  const at = $('#ewhen').value ? new Date($('#ewhen').value).toISOString() : t.at;
  const next = { ...t, cents, merchant, key: mKey(merchant), card: s.card || null, cat: s.cat, at, note: $('#enote').value.trim() };
  const changedCat = s.cat && s.cat !== t.cat;
  let msg = 'Saved';
  if (changedCat) {
    const k = next.key.slice(0, 100);
    if (k.length >= 2) { S.cfg.rules = [{ k, c: s.cat, s: 'user' }, ...S.cfg.rules.filter((r) => r.k !== k)]; saveConfig(); msg = `Saved. Future “${merchant}” purchases will be ${catById(s.cat)?.name}.`; }
    if ($('#esim')?.checked) {
      let n = 0;
      for (const list of Object.values(S.txByMonth)) for (const o of list) if (o.id !== t.id && o.key === next.key && o.cat !== s.cat) { writeTx({ ...o, cat: s.cat }, ymOf(o.at)); n++; }
      if (n) msg += ` ${n} more updated.`;
    }
  }
  closeSheet(); writeTx(next, ymOf(t.at)); toast(msg);
}
function saveCard() {
  const s = S.sheet, d = s.d;
  d.name = $('#cname').value.trim(); d.last4 = $('#clast').value.trim() || null;
  if (!d.name) return toast('Give the card a name.');
  if (d.last4 && !/^\d{4}$/.test(d.last4)) return toast('Last 4 must be four digits.');
  const lim = $('#climit').value.trim(); d.limit = lim ? Math.max(0, parseCents(lim) || 0) : null;
  if ($('#carch')) d.archived = $('#carch').checked;
  const isNew = !d.id;
  if (isNew) { d.id = uid(); S.cfg.cards.push(d); } else S.cfg.cards = S.cfg.cards.map((c) => (c.id === d.id ? d : c));
  let attached = 0;
  if (s.alias) S.cfg.aliases[normC(s.alias)] = d.id;
  for (const list of Object.values(S.txByMonth)) for (const t of list) if (!t.card && t.raw && matchCard(t.raw) === d.id) { writeTx({ ...t, card: d.id }); attached++; }
  saveConfig(); closeSheet(); render();
  toast(isNew ? `Card added${attached ? ` · ${attached} Wallet purchase${attached === 1 ? '' : 's'} linked` : ''}` : 'Card saved');
}
function doLink(cardId) {
  const alias = S.sheet.alias; S.cfg.aliases[normC(alias)] = cardId; saveConfig();
  let n = 0; for (const list of Object.values(S.txByMonth)) for (const t of list) if (!t.card && t.raw && normC(t.raw) === normC(alias)) { writeTx({ ...t, card: cardId }); n++; }
  closeSheet(); toast(`Linked “${alias}” · ${n} transaction${n === 1 ? '' : 's'} updated`);
}
function saveBudgets() {
  document.querySelectorAll('[data-bud]').forEach((i) => { const c = parseCents(i.value || '0'); if (c !== null && c >= 0) S.cfg.budgets[i.dataset.bud] = c; });
  const name = $('#ncname').value.trim();
  if (name) {
    if (S.cfg.categories.some((c) => c.name.toLowerCase() === name.toLowerCase())) return toast('That category already exists.');
    const id = 'c-' + uid().slice(0, 8);
    S.cfg.categories.push({ id, name: name.slice(0, 40), icon: $('#ncicon').value.trim() || '•', color: SWATCHES[(S.cfg.categories.length) % SWATCHES.length] });
    S.cfg.budgets[id] = Math.max(0, parseCents($('#ncbud').value || '0') || 0);
  }
  saveConfig(); closeSheet(); render(); toast('Budgets saved');
}
async function exportCsv() {
  if (S.db) for (const ym of S.cfg.months) await loadMonthOnce(ym).catch(() => {});
  const rows = Object.values(S.txByMonth).flat().sort((a, b) => b.at.localeCompare(a.at));
  const cell = (v) => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [['date', 'amount', 'currency', 'merchant', 'card', 'wallet_card_name', 'category', 'note', 'source'], ...rows.map((t) => [t.at, decimal(t.cents), S.cfg.currency, t.merchant, cardById(t.card)?.name || '', t.raw || '', catById(t.cat)?.name || '', t.note || '', t.src])].map((r) => r.map(cell).join(',')).join('\r\n') + '\r\n';
  if (!S.dl) return toast('Downloads aren’t available here. Open the page in a browser while signed in.');
  try { await S.dl.save({ filename: `pocket-ledger-${new Date().toISOString().slice(0, 10)}.csv`, data: csv }); } catch (e) { if (e?.code !== 'dismissed' && e?.code !== 'cancelled') toast('Export was not saved.'); }
}

/* ───────────── CSV import ───────────── */
function parseCsv(text) {
  const rows = []; let row = [], f = '', q = false; const src = text.replace(/^﻿/, '');
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (q) { if (ch === '"') { if (src[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; continue; }
    if (ch === '"') q = true; else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && src[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some((c) => c.trim())) rows.push(row); row = []; }
    else f += ch;
  }
  row.push(f); if (row.some((c) => c.trim())) rows.push(row); return rows;
}
function parseDate(v, order) {
  const s = String(v || '').trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return mk(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) { const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; return order === 'dmy' ? mk(y, +m[2], +m[1]) : mk(y, +m[1], +m[2]); }
  const d = new Date(s); return isNaN(d) ? null : mk(d.getFullYear(), d.getMonth() + 1, d.getDate());
  function mk(y, mo, d) { return mo >= 1 && mo <= 12 && d >= 1 && d <= 31 ? new Date(y, mo - 1, d, 12) : null; }
}
async function readCsv(file, s) {
  if (!file) return;
  const rows = parseCsv(await file.text());
  if (!rows.length) return toast('That file has no rows.');
  const first = rows[0], header = first.every((c) => !/^\s*-?\$?\d[\d,.]*\s*$/.test(c)) && !first.some((c) => /\d{1,4}[-/.]\d{1,2}[-/.]\d{1,4}/.test(c));
  const h = header ? first.map((x) => x.toLowerCase()) : [];
  const find = (...res) => { for (const re of res) { const i = h.findIndex((x) => re.test(x)); if (i >= 0) return i; } return -1; };
  const map = header ? { date: find(/date|posted/), merch: find(/description|merchant|payee|name|details|memo/), amount: find(/amount|value/), debit: find(/debit|withdraw|money out/), credit: find(/credit|deposit|money in/) } : { date: 0, merch: 1, amount: 2, debit: first.length > 3 ? 2 : -1, credit: first.length > 3 ? 3 : -1 };
  const dataRows = header ? rows.slice(1) : rows;
  const order = dataRows.slice(0, 60).some((r) => +(String(r[map.date] || '').match(/^(\d{1,2})[/.-]/)?.[1] || 0) > 12) ? 'dmy' : 'mdy';
  Object.assign(s, { name: file.name, rows, header, map, mode: map.amount < 0 && map.debit >= 0 ? 'split' : !header && first.length >= 4 ? 'split' : 'single', neg: false, order, card: '' });
  $('#sheet-root').querySelector('label[for="csvfile"]').textContent = '📄 ' + file.name;
  renderCsvMap(s);
}
function csvMapped(s) {
  const body = s.header ? s.rows.slice(1) : s.rows;
  return body.map((r) => {
    const date = s.map.date >= 0 ? parseDate(r[s.map.date], s.order) : null, merchant = s.map.merch >= 0 ? String(r[s.map.merch] || '').trim() : '';
    let cents = null;
    if (s.mode === 'single' && s.map.amount >= 0) { const v = parseCents(r[s.map.amount] || ''); cents = v === null ? null : s.neg ? -v : v; }
    if (s.mode === 'split') { const d = s.map.debit >= 0 ? parseCents(r[s.map.debit] || '') : null, c = s.map.credit >= 0 ? parseCents(r[s.map.credit] || '') : null; cents = d ? Math.abs(d) : c ? -Math.abs(c) : null; }
    return { date, merchant, cents };
  });
}
function renderCsvMap(s) {
  const cols = (s.header ? s.rows[0] : s.rows[0].map((_, i) => 'Column ' + (i + 1))), sample = (s.header ? s.rows[1] : s.rows[0]) || [];
  const sel = (label, k) => `<label class="fl" for="m-${k}"><span>${label}</span><select class="t" id="m-${k}" data-map="${k}"><option value="-1">—</option>${cols.map((c, i) => `<option value="${i}" ${s.map[k] === i ? 'selected' : ''}>${esc(c || 'Column ' + (i + 1))}${sample[i] ? ' (e.g. ' + esc(String(sample[i]).slice(0, 22)) + ')' : ''}</option>`).join('')}</select></label>`;
  const m = csvMapped(s), valid = m.filter((x) => x.date && x.merchant && x.cents);
  $('#csvmap').innerHTML = `<div class="sec">Columns</div><div class="group"><div class="cell"><span class="grow">First row is a header</span>${sw('csvh', s.header, 'First row is a header')}</div>${sel('Date', 'date')}${sel('Merchant', 'merch')}</div>
    <div class="sec">Amount</div><div class="seg"><button type="button" data-mode="single" aria-pressed="${s.mode === 'single'}">One column</button><button type="button" data-mode="split" aria-pressed="${s.mode === 'split'}">Debit / Credit</button></div>
    <div class="group" style="margin-top:8px">${s.mode === 'single' ? sel('Amount', 'amount') + `<div class="cell"><span class="grow">Expenses are negative</span>${sw('csvneg', s.neg, 'Expenses are negative numbers')}</div>` : sel('Debit', 'debit') + sel('Credit', 'credit')}</div>
    <div class="sec">Options</div><div class="group"><label class="fl" for="csvorder"><span>Dates</span><select class="t" id="csvorder"><option value="mdy" ${s.order === 'mdy' ? 'selected' : ''}>MM/DD/YYYY</option><option value="dmy" ${s.order === 'dmy' ? 'selected' : ''}>DD/MM/YYYY</option></select></label><label class="fl" for="csvcard"><span>Card</span><select class="t" id="csvcard"><option value="">None</option>${S.cfg.cards.map((c) => `<option value="${esc(c.id)}" ${s.card === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label></div>
    <div class="sec">Preview · ${valid.length} of ${m.length} rows readable</div><div class="group">${m.slice(0, 6).map((x) => `<div class="cell" style="${x.date && x.merchant && x.cents ? '' : 'opacity:.45'}"><span class="faint num small" style="width:84px;flex:none">${x.date ? esc(localInput(x.date).slice(0, 10)) : '??'}</span><span class="grow ell">${esc(x.merchant || '—')}</span><span class="amt-col ${x.cents < 0 ? 'refund' : ''}">${x.cents ? money(x.cents) : '—'}</span></div>`).join('')}</div>
    <p class="foot">Positive amounts are spending, negative are refunds or payments. Check the signs look right.</p>
    <button class="btn" style="margin-top:14px" data-act="doimport" ${valid.length ? '' : 'disabled'}>Import ${valid.length} rows</button>`;
  const root = $('#csvmap');
  root.querySelectorAll('[data-map]').forEach((el) => el.addEventListener('change', () => { s.map[el.dataset.map] = +el.value; renderCsvMap(s); }));
  root.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => { s.mode = b.dataset.mode; renderCsvMap(s); }));
  $('#csvh').addEventListener('change', (e) => { s.header = e.target.checked; renderCsvMap(s); });
  $('#csvneg')?.addEventListener('change', (e) => { s.neg = e.target.checked; renderCsvMap(s); });
  $('#csvorder').addEventListener('change', (e) => { s.order = e.target.value; renderCsvMap(s); });
  $('#csvcard').addEventListener('change', (e) => { s.card = e.target.value; });
}
async function doImport() {
  const s = S.sheet, valid = csvMapped(s).filter((x) => x.date && x.merchant && x.cents);
  const months = [...new Set(valid.map((x) => ymOf(x.date)))];
  for (const ym of months) await loadMonthOnce(ym).catch(() => {});
  const pool = months.flatMap((ym) => S.txByMonth[ym] || []).map((t) => ({ ...t, used: false }));
  const similar = (a, b) => a === b || a.includes(b) || b.includes(a) || (a.split(' ')[0].length >= 3 && a.split(' ')[0] === b.split(' ')[0]);
  let added = 0, dup = 0;
  for (const x of valid) {
    const key = mKey(x.merchant), card = s.card || null;
    const hit = pool.find((e) => !e.used && e.cents === x.cents && (!card || !e.card || e.card === card) && Math.abs(new Date(e.at) - x.date) <= 3 * 864e5 && similar(e.key, key));
    if (hit) { hit.used = true; dup++; continue; }
    await writeTx({ id: uid(), cents: x.cents, merchant: x.merchant, key, card, raw: null, cat: categorize(x.merchant), at: x.date.toISOString(), note: '', src: 'import' });
    added++;
  }
  closeSheet(); toast(`Imported ${added} · skipped ${dup} already logged`);
}

/* ───────────── event delegation ───────────── */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const v = el.dataset.v, act = el.dataset.act;
  const A = {
    tab: () => { S.tab = v; S.sheet = null; window.scrollTo(0, 0); render(); },
    add: () => { S.sheet = null; openSheet({ type: 'add', card: activeCards().some((c) => c.id === S.cfg.lastCard) ? S.cfg.lastCard : activeCards()[0]?.id || null, cat: null }); $('#amt')?.focus(); },
    submitadd: submitAdd,
    close: closeSheet,
    month: () => { S.month = shiftYm(S.month, +v); S.pickedDay = null; S.picked = null; subscribeMonth(S.month); render(); },
    pick: () => { S.picked = S.picked === v ? null : v; render(); },
    day: () => { S.pickedDay = S.pickedDay === +v ? null : +v; render(); },
    edit: () => { const t = (S.txByMonth[el.dataset.ym] || []).find((x) => x.id === v); if (t) openSheet({ type: 'edit', tx: t, cat: t.cat, card: t.card }); },
    saveedit: saveEdit,

    nodel: () => { $('#delconfirm').innerHTML = ''; },
    yesdeltx: () => { const t = S.sheet.tx; closeSheet(); deleteTx(t); toast('Deleted'); },
    editlogged: () => { const t = S.sheet.tx; S.sheet = null; openSheet({ type: 'edit', tx: t, cat: t.cat, card: t.card }); },
    newcard: () => openSheet({ type: 'card', d: { name: '', last4: '', color: SWATCHES[S.cfg.cards.length % SWATCHES.length], type: 'credit', limit: null, archived: false } }),
    newcardalias: () => { const alias = S.sheet.alias; S.sheet = null; openSheet({ type: 'card', alias, d: { name: alias, last4: '', color: SWATCHES[S.cfg.cards.length % SWATCHES.length], type: 'credit', limit: null, archived: false } }); },
    opencard: () => { const c = cardById(v); if (c) { S.sheet = null; openSheet({ type: 'card', d: { ...c } }); } },
    savecard: saveCard,
    delcard: () => { $('#delconfirm').innerHTML = `<p class="foot">Transactions on this card are kept and become unassigned.</p><div class="row" style="margin-top:8px"><button class="btn alt" data-act="nodel">Keep</button><button class="btn" style="background:var(--bad)" data-act="yesdelcard">Delete</button></div>`; },
    yesdelcard: () => { const id = S.sheet.d.id; S.cfg.cards = S.cfg.cards.filter((c) => c.id !== id); for (const [k, cid] of Object.entries(S.cfg.aliases)) if (cid === id) delete S.cfg.aliases[k]; for (const list of Object.values(S.txByMonth)) for (const t of list) if (t.card === id) writeTx({ ...t, card: null }); saveConfig(); closeSheet(); render(); },
    cardslist: () => openSheet({ type: 'cardslist' }),
    linkcard: () => openSheet({ type: 'linkcard', alias: v }),
    dolink: () => doLink(v),
    editbudgets: () => openSheet({ type: 'budgets' }),
    savebudgets: saveBudgets,
    filters: () => openSheet({ type: 'filters' }),
    resetf: () => { S.search = { ...S.search, card: '', cat: '', from: '', to: '' }; S.sheet = null; openSheet({ type: 'filters' }); render(); },
    clearf: () => { if (v === 'date') { S.search.from = ''; S.search.to = ''; } else S.search[v] = ''; render(); },
    loadall: async () => { el.disabled = true; el.textContent = 'Loading…'; for (const ym of S.cfg.months) await loadMonthOnce(ym).catch(() => {}); render(); },
    rules: () => openSheet({ type: 'rules' }),
    addrule: () => { const k = normM($('#rk').value).slice(0, 100), c = $('#rc').value; if (k.length < 2 || !c) return toast('Enter a keyword (2+ letters) and pick a category.'); S.cfg.rules = [{ k, c, s: 'user' }, ...S.cfg.rules.filter((r) => r.k !== k)]; saveConfig(); S.sheet = null; openSheet({ type: 'rules' }); toast('Rule added'); },
    delrule: () => { S.cfg.rules.splice(+v, 1); saveConfig(); S.sheet = null; openSheet({ type: 'rules' }); },
    wallet: () => openSheet({ type: 'wallet' }),
    copytpl: () => { const t = APP_URL + '#w-'; navigator.clipboard?.writeText(t).then(() => toast('Copied'), () => toast('Select the link and copy it.')); },
    trylink: () => { closeSheet(); location.hash = 'w-645-Starbucks--Amex-Cobalt'; },
    import: () => openSheet({ type: 'import' }),
    doimport: doImport,
    export: exportCsv,
  };
  A[act]?.();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.search.q = e.target.value; clearTimeout(document._qt); document._qt = setTimeout(render, 200); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'currency') { S.cfg.currency = e.target.value; saveConfig(); render(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
window.addEventListener('hashchange', handleHash);

boot();
})();
